name: Labo - verification sur donnees courtier

on:
  workflow_dispatch:
    inputs:
      strat:
        description: "Identifiant de la strategie (vide = meilleure forex 1 h)"
        required: false
        default: ""
      file:
        description: "Fichier de strategies"
        required: false
        default: "strategies.json"
      kind:
        description: "Marche rejoue (fx ou cr)"
        required: false
        default: "fx"
      days:
        description: "Jours d'historique"
        required: false
        default: "730"
      dir:
        description: "Sens force : 1 achat, -1 vente (vide = sens de la strategie)"
        required: false
        default: ""

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verification
        env:
          VAL_STRAT: ${{ inputs.strat }}
          VAL_FILE: ${{ inputs.file }}
          VAL_KIND: ${{ inputs.kind }}
          VAL_DAYS: ${{ inputs.days }}
          VAL_DIR: ${{ inputs.dir }}
          PYTHONUNBUFFERED: '1'
        run: python -m lab.validate
      - name: Publication
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            mkdir -p /tmp/v && cp validation*.json /tmp/v/
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/v/*.json .
            git add validation*.json
            git diff --cached --quiet && exit 0
            git commit -qm "labo : verification sur donnees courtier [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
