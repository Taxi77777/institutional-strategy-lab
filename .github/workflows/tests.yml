name: Tests
on:
  workflow_dispatch:      # a la demande seulement : les tests a chaque envoi prenaient des places de calcul
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt pytest pyflakes
      - run: python -m pyflakes lab tests
      - run: python -m pytest -q
