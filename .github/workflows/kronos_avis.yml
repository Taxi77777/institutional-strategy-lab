name: Kronos - avis immediat

# Demande l'avis de Kronos tout de suite : 5 prochaines bougies jour prevues pour chaque actif (pas un signal).
on:
  schedule:
    - cron: '7 */4 * * *'        # toutes les 4 h : l'armee ne donne un signal que dans le sens de Kronos
  workflow_dispatch:

concurrency:
  group: kronos-avis
  cancel-in-progress: false

jobs:
  avis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: shiyu-coder/Kronos
          ref: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
          path: kronos_src
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install einops==0.8.1 huggingface_hub==0.33.1 safetensors==0.6.2 tqdm pandas
      - name: Avis de Kronos
        env:
          KRONOS_DIR: kronos_src
          PYTHONUNBUFFERED: '1'
        run: python -m lab.kronos_ia avis
      - name: Publication de l'avis
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          cp donnees/kronos/avis.json /tmp/avis.json
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p donnees/kronos && cp /tmp/avis.json donnees/kronos/avis.json
            git add donnees/kronos/avis.json
            git diff --cached --quiet && exit 0
            git commit -qm "Kronos : avis [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
