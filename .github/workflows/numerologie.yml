name: Labo - recherche numerologie (strategie a part)

# Recherche dediee aux numerologies (toutes traditions), en parallele de la recherche principale.
# Publie strategies_numerologie.json, que l'armee lit a part (jamais melange au vote).
on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  group: lab-numerologie
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: fx, tf: 1H}
          - {kind: cr, tf: 1H}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        if: matrix.kind == 'fx'
        with:
          path: .duka_cache
          key: duka-num-1H-${{ github.run_id }}
          restore-keys: |
            duka-num-1H-
            duka-1H-
      - name: Recherche numerologie ${{ matrix.kind }} ${{ matrix.tf }}
        env:
          AGENTS_ONLY: numerologie
          MIN_WIN: ${{ vars.MIN_WIN }}
          BEAM: ${{ vars.BEAM || '60' }}
          DUKA_CACHE: .duka_cache
          PYTHONUNBUFFERED: '1'
        run: python -m lab.miner part ${{ matrix.kind }} ${{ matrix.tf }}
      - uses: actions/upload-artifact@v4
        with:
          name: num-${{ matrix.kind }}-${{ matrix.tf }}
          path: parts/
          retention-days: 7

  publish:
    needs: mine
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: num-*
          path: parts
          merge-multiple: true
      - name: Fusion
        run: python -m lab.miner merge strategies_numerologie.json
      - name: Publication
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            cp strategies_numerologie.json /tmp/sn.json
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/sn.json strategies_numerologie.json
            git add strategies_numerologie.json
            git diff --cached --quiet && exit 0
            git commit -qm "labo : strategies numerologie [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
