name: Labo - recherche de strategies (armee des 20)

# Cherche sans arret les strategies >= 80 % de reussite et gagnantes apres frais, sur des donnees jamais vues.
on:
  schedule:
    - cron: '17 */6 * * *'      # secours : la recherche se relance elle-meme sans arret (voir fin du fichier)
  workflow_dispatch:
    inputs:
      voie:
        description: "Voie de recherche (1 et 2 : bougies 1 h ; 3 : bougies 4 h et 15 min ; 4 : bougies jour ; 5 : bougies 30 min)"
        default: "1"

concurrency:
  group: lab-mine-${{ inputs.voie || '1' }}
  cancel-in-progress: false

jobs:
  # une recherche par classe et unite de temps, en parallele (chacune a jusqu'a 6 h) ; forex 15 min en priorite
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2                # laisse toujours de la place a l'armee (20 calculs GitHub en meme temps)
      matrix:
        # voies 1 et 2 : bougies 1 h ; voie 3 (demande du 5 nov.) : bougies 4 h et 15 min
        include: ${{ fromJSON(inputs.voie == '5' && '[{"kind":"fx","tf":"30M","shard":"a","exits":"e1,e2,e3,e4"},{"kind":"fx","tf":"30M","shard":"b","exits":"e5,e6,e7"},{"kind":"cr","tf":"30M","shard":"a","exits":"e1,e2,e3,e4"},{"kind":"cr","tf":"30M","shard":"b","exits":"e5,e6,e7"}]' || inputs.voie == '4' && '[{"kind":"fx","tf":"1D","shard":"a","exits":"e1,e2,e3,e4,e5,e6,e7"},{"kind":"cr","tf":"1D","shard":"a","exits":"e1,e2,e3,e4,e5,e6,e7"}]' || inputs.voie == '3' && '[{"kind":"fx","tf":"4H","shard":"a","exits":"e1,e2,e3,e4"},{"kind":"fx","tf":"4H","shard":"b","exits":"e5,e6,e7"},{"kind":"cr","tf":"4H","shard":"a","exits":"e1,e2,e3,e4"},{"kind":"cr","tf":"4H","shard":"b","exits":"e5,e6,e7"},{"kind":"fx","tf":"15M","shard":"a","exits":"e1,e2,e3,e4"},{"kind":"fx","tf":"15M","shard":"b","exits":"e5,e6,e7"},{"kind":"cr","tf":"15M","shard":"a","exits":"e1,e2,e3,e4"},{"kind":"cr","tf":"15M","shard":"b","exits":"e5,e6,e7"}]' || '[{"kind":"fx","tf":"1H","shard":"a","exits":"e1,e2,e3"},{"kind":"fx","tf":"1H","shard":"b","exits":"e4,e5"},{"kind":"fx","tf":"1H","shard":"c","exits":"e6,e7"},{"kind":"cr","tf":"1H","shard":"a","exits":"e1,e2,e3"},{"kind":"cr","tf":"1H","shard":"b","exits":"e4,e5"},{"kind":"cr","tf":"1H","shard":"c","exits":"e6,e7"}]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4            # forex (Dukascopy) et crypto (Coinbase, Binance) : seuls les fichiers nouveaux
        with:
          path: .duka_cache
          key: ${{ matrix.kind == 'fx' && 'duka' || 'cr' }}-${{ matrix.tf }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: ${{ matrix.kind == 'fx' && 'duka' || 'cr' }}-${{ matrix.tf }}-
      - name: Recherche ${{ matrix.kind }} ${{ matrix.tf }} (sorties ${{ matrix.exits }})
        env:
          MIN_WIN: ${{ vars.MIN_WIN }}
          CONSENSUS: ${{ vars.CONSENSUS }}
          BEAM: ${{ vars.BEAM || '60' }}
          DUKA_CACHE: .duka_cache
          EXIT_IDS: ${{ matrix.exits }}
          # demande du 5 nov. : tous les specialistes cherchent dans la liquidite, le prix avance et les flux des banques
          AGENTS_ONLY: ${{ vars.AGENTS_ONLY || 'liquidite,smc,orderflow,flux,positionnement,structure,amd,chiffres_ronds,fibonacci,bougies,chandeliers,profil,vwap,carnet,kronos,inventeur' }}
          IDEA_SEED: ${{ github.run_id }}
          PYTHONUNBUFFERED: '1'
        run: python -m lab.miner part ${{ matrix.kind }} ${{ matrix.tf }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.kind }}-${{ matrix.tf }}-${{ matrix.shard }}
          path: parts/
          retention-days: 7

  publish:
    needs: mine
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Fusion
        run: python -m lab.miner merge
      - name: Publication des strategies
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            # deux voies en parallele : on refusionne sur la toute derniere version publiee (rien n'est perdu)
            git fetch -q origin main && git reset -q --hard origin/main
            python -m lab.miner merge
            git add strategies.json ideas.json 2>/dev/null || git add strategies.json
            git diff --cached --quiet && exit 0
            git commit -qm "labo : nouvelles strategies [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
      - name: Recherche suivante (sans arret, nouvelles idees de l'Inventeur a chaque tour)
        if: always() && vars.CONTINU != 'stop' && inputs.voie != '2'     # voie 2 arretee : doublon de la voie 1 (1 h)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mine.yml -R ${{ github.repository }} --ref main -f voie=${{ inputs.voie || '1' }}
