name: Labo - recherche de strategies (armee des 20)

# Cherche sans arret les strategies >= 80 % de reussite et gagnantes apres frais, sur des donnees jamais vues.
on:
  schedule:
    - cron: '17 */6 * * *'      # secours : la recherche se relance elle-meme sans arret (voir fin du fichier)
  workflow_dispatch:

concurrency:
  group: lab-mine
  cancel-in-progress: false

jobs:
  # une recherche par classe et unite de temps, en parallele (chacune a jusqu'a 6 h) ; forex 15 min en priorite
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: fx, tf: 15M}
          - {kind: fx, tf: 5M}
          - {kind: fx, tf: 30M}
          - {kind: fx, tf: 1H}
          - {kind: cr, tf: 15M}
          - {kind: cr, tf: 30M}
          - {kind: cr, tf: 1H}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        if: matrix.kind == 'fx'
        with:
          path: .duka_cache
          key: duka-${{ matrix.tf }}-${{ github.run_id }}
          restore-keys: duka-${{ matrix.tf }}-
      - name: Recherche ${{ matrix.kind }} ${{ matrix.tf }}
        env:
          MIN_WIN: ${{ vars.MIN_WIN }}
          CONSENSUS: ${{ vars.CONSENSUS }}
          BEAM: ${{ vars.BEAM }}
          DUKA_CACHE: .duka_cache
          PYTHONUNBUFFERED: '1'
        run: python -m lab.miner part ${{ matrix.kind }} ${{ matrix.tf }}
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.kind }}-${{ matrix.tf }}
          path: parts/
          retention-days: 7

  publish:
    needs: mine
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true
      - name: Fusion
        run: python -m lab.miner merge
      - name: Publication des strategies
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            cp strategies.json /tmp/strategies.json
            cp ideas.json /tmp/ideas.json 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/strategies.json strategies.json
            cp /tmp/ideas.json ideas.json 2>/dev/null || true
            git add strategies.json ideas.json 2>/dev/null || git add strategies.json
            git diff --cached --quiet && exit 0
            git commit -qm "labo : nouvelles strategies [skip ci]"
            git push -q origin HEAD:main && exit 0
            sleep 5
          done
      - name: Recherche suivante (sans arret, nouvelles idees de l'Inventeur a chaque tour)
        if: always() && vars.CONTINU != 'stop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mine.yml -R ${{ github.repository }} --ref main
