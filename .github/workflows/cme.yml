name: CME - bulletin quotidien des devises

# Vrai volume et positions ouvertes des contrats a terme sur devises (EUR, GBP, JPY, CHF, CAD, AUD, NZD...) :
# bulletin quotidien public du CME, sans inscription. Le texte est garde chaque jour (historique a tester).
on:
  schedule:
    - cron: '41 6 * * 2-6'        # bulletin de la veille (publie le soir, heure de Chicago)
  workflow_dispatch:

concurrency:
  group: cme
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pypdf==5.1.0 requests
      - name: Telechargement et texte
        run: |
          python3 - <<'PY'
          import io, os, re, time, requests
          from pypdf import PdfReader
          url = "https://www.cmegroup.com/daily_bulletin/current/Section07_Currency_Futures.pdf"
          r = requests.get(url, timeout=60, headers={"User-Agent": "Mozilla/5.0 (labo de recherche)"})
          print("HTTP", r.status_code, len(r.content))
          r.raise_for_status()
          txt = "\n".join(p.extract_text() or "" for p in PdfReader(io.BytesIO(r.content)).pages)
          m = re.search(r"(\d{2})/(\d{2})/(\d{4})", txt)
          day = "%s-%s-%s" % (m.group(3), m.group(1), m.group(2)) if m else time.strftime("%Y-%m-%d")
          os.makedirs("donnees/cme", exist_ok=True)
          with open("donnees/cme/%s_devises.txt" % day, "w") as f:
              f.write(txt)
          print("JOUR", day)
          print(txt[:6000])
          PY
      - name: Publication
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add donnees/cme
          git diff --cached --quiet && exit 0
          git commit -qm "CME : bulletin devises [skip ci]"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
